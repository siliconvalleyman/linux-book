pid /srv/handbook/nginx.pid;
error_log /srv/handbook/error.log warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format handbook escape=json '{"time":"$time_iso8601","status":$status,'
        '"duration":$request_time,"upstream":"$upstream_addr"}';
    access_log /srv/handbook/access.log handbook;
    limit_req_zone $binary_remote_addr zone=handbook_api:1m rate=5r/s;

    upstream app_servers {
        server 127.0.0.1:18081 max_fails=2 fail_timeout=10s;
        server 127.0.0.1:18082 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 127.0.0.1:18443 ssl;
        server_name lab.example;
        ssl_certificate /srv/handbook/tls/lab.crt;
        ssl_certificate_key /srv/handbook/tls/lab.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        server_tokens off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        root /srv/handbook/www;
        location / {
            try_files $uri $uri/ =404;
        }
        location /api/ {
            limit_req zone=handbook_api burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://app_servers/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }
    }
}
