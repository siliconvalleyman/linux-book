name: Documentation links and inventory

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/**'
      - 'tests/**'
      - 'configs/**'
      - '.github/**'
      - '.github/workflows/link-check.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/**'
      - 'tests/**'
      - 'configs/**'
      - '.github/**'
      - '.github/workflows/link-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 tests/validate_docs.py
      - if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: python3 tests/validate_docs.py --external
